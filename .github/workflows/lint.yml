name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1 reads BOM-less files as ANSI, which corrupts non-ASCII characters
      - name: Check scripts are ASCII
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -Filter *.ps1 | Select-String -Pattern '[^\x00-\x7F]'
          if ($bad) { $bad | ForEach-Object { "::error file=$($_.Path),line=$($_.LineNumber)::Non-ASCII character" }; exit 1 }

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning, Error
          $results | ForEach-Object { "::error file=$($_.ScriptPath),line=$($_.Line)::$($_.RuleName): $($_.Message)" }
          if ($results) { exit 1 }
